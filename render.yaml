services:
  # Backend Service
  - type: web
    name: task-management-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DB_SYNCHRONIZE
        value: true
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://management-task1.vercel.app

  # Frontend Service (Static Site)
  - type: static
    name: task-management-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: task-management-backend
          property: url
